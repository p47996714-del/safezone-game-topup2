<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Zone - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#0b1120,#1e293b);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(30,41,59,0.9);padding:30px;border-radius:24px;width:100%;max-width:400px;border:1px solid #334155;box-shadow:0 20px 50px rgba(0,0,0,0.5);backdrop-filter:blur(10px)}
.logo{text-align:center;margin-bottom:25px}
.logo img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(56,189,248,0.5))}
.logo h1{font-size:22px;font-weight:bold;margin-top:10px;background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{font-size:12px;color:#94a3b8;letter-spacing:2px;margin-top:4px}
input{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:14px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;font-family:inherit}
input:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,0.15)}
button{width:100%;padding:15px;background:linear-gradient(135deg,#38bdf8,#a855f7);color:#fff;border:none;border-radius:14px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:5px;transition:transform 0.2s}
button:active{transform:scale(0.97)}
.toggle-link{text-align:center;margin-top:15px;font-size:13px;color:#94a3b8}
.toggle-link a{color:#38bdf8;text-decoration:none;font-weight:bold}
.error{background:rgba(239,68,68,0.1);border:1px solid #ef4444;color:#fca5a5;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;text-align:center}
.register-fields{display:none}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <img src="https://i.imgur.com/iRwIfqs.png" alt="logo">
    <h1>SAFE ZONE</h1>
    <p>GAME TOPUP</p>
  </div>
  <div id="errorBox" class="error"></div>
  <input type="text" id="username" placeholder="Username" autocomplete="username">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <div class="register-fields" id="registerFields">
    <input type="tel" id="phone" placeholder="Phone Number (09xxxxxxxxx)">
    <input type="text" id="referral" placeholder="Referral Code (Optional)">
  </div>
  <button onclick="submitForm()" id="submitBtn">Login</button>
  <div class="toggle-link">
    <span id="toggleText">Account မရှိဘူးလား?</span> 
    <a href="#" onclick="toggleMode(event)" id="toggleBtn">Register လုပ်ပါ</a>
  </div>
</div>
<script>
let isRegister = false;
function toggleMode(e) {
  e.preventDefault();
  isRegister = !isRegister;
  document.getElementById('registerFields').style.display = isRegister ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = isRegister ? 'Register' : 'Login';
  document.getElementById('toggleText').textContent = isRegister ? 'Account ရှိပြီးသားလား?' : 'Account မရှိဘူးလား?';
  document.getElementById('toggleBtn').textContent = isRegister ? 'Login ပြန်ဝင်ပါ' : 'Register လုပ်ပါ';
  document.getElementById('errorBox').style.display = 'none';
}
function showError(msg) {
  const e = document.getElementById('errorBox');
  e.textContent = msg;
  e.style.display = 'block';
}
async function submitForm() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const referral = document.getElementById('referral').value.trim();
  if (!username || !password) return showError('Username နဲ့ Password ဖြည့်ပါ');
  const btn = document.getElementById('submitBtn');
  btn.textContent = '⏳ စောင့်ပါ...';
  btn.disabled = true;
  try {
    const url = isRegister ? '/api/register' : '/api/login';
    const body = isRegister ? { username, password, phone, referral } : { username, password };
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.success) {
      if (isRegister) {
        // Auto login after register
        const loginRes = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const loginData = await loginRes.json();
        if (loginData.success) {
          localStorage.setItem('token', loginData.token);
          localStorage.setItem('username', loginData.username);
          window.location.href = '/app.html';
        } else {
          showError('Register ပြီးပါပြီ။ Login ပြန်ဝင်ပါ။');
          isRegister = false;
          toggleMode(new Event('click'));
        }
      } else {
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        window.location.href = '/app.html';
      }
    } else {
      showError(data.error || 'တစ်ခုခု မှားနေပါတယ်');
      btn.textContent = isRegister ? 'Register' : 'Login';
      btn.disabled = false;
    }
  } catch (e) {
    showError('Server နဲ့ ချိတ်ဆက်လို့ မရပါ');
    btn.textContent = isRegister ? 'Register' : 'Login';
    btn.disabled = false;
  }
}
// Auto-fill if already logged in
if (localStorage.getItem('token')) {
  window.location.href = '/app.html';
}
</script>
</body>
</html>
