<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Zone - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#0b1120,#1e293b);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:rgba(30,41,59,0.9);padding:30px;border-radius:24px;width:100%;max-width:400px;border:1px solid #334155;box-shadow:0 20px 50px rgba(0,0,0,0.5);backdrop-filter:blur(10px)}
.logo{text-align:center;margin-bottom:25px}
.logo img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(56,189,248,0.5))}
.logo h1{font-size:22px;font-weight:bold;margin-top:10px;background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{font-size:12px;color:#94a3b8;letter-spacing:2px;margin-top:4px}
input[type="text"],input[type="password"],input[type="tel"]{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:14px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;font-family:inherit}
input:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,0.15)}
button{width:100%;padding:15px;background:linear-gradient(135deg,#38bdf8,#a855f7);color:#fff;border:none;border-radius:14px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:5px;transition:transform 0.2s}
button:active{transform:scale(0.97)}
.toggle-link{text-align:center;margin-top:15px;font-size:13px;color:#94a3b8}
.toggle-link a{color:#38bdf8;text-decoration:none;font-weight:bold}
.error{background:rgba(239,68,68,0.1);border:1px solid #ef4444;color:#fca5a5;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;text-align:center}
.terms-box{display:flex;align-items:flex-start;gap:10px;margin-bottom:15px;font-size:13px;color:#94a3b8}
.terms-box input[type="checkbox"]{width:18px;height:18px;margin-top:2px;accent-color:#38bdf8;cursor:pointer}
.terms-box a{color:#38bdf8;text-decoration:none}
.register-fields{display:none}
.login-fields{display:none}
</style>

<style id="_NUCLEAR_BAN_HIDE_">
._banOv,._banOv2,#_banOv,#_banOv2{display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important}
button[onclick*="closeBan"],button[onclick*="closeBan2"],button[onclick*="_closeBan"]{display:none !important}
*[id*="banOv"],*[id*="_ban"]{display:none !important}
</style>

<script>
/* _SW_KILLER_V1_ */
(function(){
  console.log("🔥 SW Killer active");
  // 1. Service Worker Unregister
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      for (var i = 0; i < regs.length; i++) {
        regs[i].unregister();
        console.log("✅ SW unregistered:", regs[i].scope);
      }
    }).catch(function(e){ console.log("SW err:", e.message); });
  }
  // 2. Cache API အားလုံး ဖျက်
  if (window.caches) {
    caches.keys().then(function(keys) {
      for (var i = 0; i < keys.length; i++) {
        caches.delete(keys[i]);
        console.log("✅ Cache deleted:", keys[i]);
      }
    }).catch(function(e){ console.log("Cache err:", e.message); });
  }
  // 3. SessionStorage / LocalStorage ထဲက ban flag ဖျက်
  try {
    var keys = Object.keys(localStorage);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (k.toLowerCase().indexOf("ban") > -1 || k.indexOf("_ban") > -1) {
        localStorage.removeItem(k);
      }
    }
  } catch(e) {}
  // 4. Ban modal DOM ဖျက်
  function killBan() {
    var ids = ["_banOv", "_banOv2"];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.remove();
    }
    var all = document.querySelectorAll("[id*=banOv], [id*=BanOv], ._banOv, ._banOv2");
    for (var j = 0; j < all.length; j++) all[j].remove();
  }
  setTimeout(killBan, 100);
  setTimeout(killBan, 800);
  setTimeout(killBan, 2000);
  setInterval(killBan, 1500);
  if (window.MutationObserver) {
    try { new MutationObserver(killBan).observe(document.body, {childList:true, subtree:true}); } catch(e){}
  }
  console.log("✅ SW Killer done");
})();
</script>

#_FULL_FOOTER_,#_PRIVACY_FOOTER_{
  position:fixed !important;

body{padding-bottom:100px !important}

  #_FULL_FOOTER_ a,#_PRIVACY_FOOTER_ a{font-size:10px !important;padding:3px 8px !important}

}
</style>

<body>
<div class="login-box">
  <div class="logo">
    <img src="https://i.imgur.com/iRwIfqs.png" alt="logo">
    <h1>SAFE ZONE</h1>
    <p>GAME TOPUP</p>
  </div>
  <div id="errorBox" class="error"></div>
  <input type="text" id="username" placeholder="Username" autocomplete="username">
  <div id="registerFields" class="register-fields">
    <input type="tel" id="phone" placeholder="Phone Number (09xxxxxxxxx)">
    <input type="password" id="password" placeholder="Password" autocomplete="new-password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <div class="terms-box">
      <input type="checkbox" id="termsCheck">
      <label for="termsCheck">ကျွန်ုပ် <a href="/terms.html" target="_blank">Terms & Privacy</a> ကို လက်ခံပါသည်</label>
    </div>
  </div>
  <div id="loginFields" class="login-fields">
    <input type="password" id="passwordLogin" placeholder="Password" autocomplete="current-password">
  </div>
  <button onclick="submitForm()" id="submitBtn">Register</button>
  <div class="toggle-link">
    <span id="toggleText">Account ရှိပြီးသားလား?</span> 
    <a href="#" onclick="toggleMode(event)" id="toggleBtn">Login ပြန်ဝင်ပါ</a>
  </div>
</div>
<script>
let isRegister = true;

// Show register fields initially
document.getElementById('registerFields').style.display = 'block';
document.getElementById('loginFields').style.display = 'none';
document.getElementById('submitBtn').textContent = 'Register';

function toggleMode(e) {
  if (e) e.preventDefault();
  isRegister = !isRegister;
  document.getElementById('registerFields').style.display = isRegister ? 'block' : 'none';
  document.getElementById('loginFields').style.display = isRegister ? 'none' : 'block';
  document.getElementById('submitBtn').textContent = isRegister ? 'Register' : 'Login';
  document.getElementById('toggleText').textContent = isRegister ? 'Account ရှိပြီးသားလား?' : 'Account မရှိဘူးလား?';
  document.getElementById('toggleBtn').textContent = isRegister ? 'Login ပြန်ဝင်ပါ' : 'Register လုပ်ပါ';
  document.getElementById('errorBox').style.display = 'none';
}

function showError(msg) {
  // ရိုးရိုး alert မဟုတ်ဘဲ လှပတဲ့ Error Box
  var box = document.getElementById('errorBox');
  if (!box) {
    // တခြား name ရှိလား စစ်
    box = document.getElementById('error');
  }
  if (!box) {
    // မရှိရင် အသစ် ဖန်တီး
    box = document.createElement('div');
    box.id = 'errorBox';
    box.style.cssText = 'background:rgba(239,68,68,0.1);border:1px solid #ef4444;color:#fca5a5;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:12px;text-align:center;display:none;animation:_errShake 0.4s';
    var target = document.querySelector('.login-box') || document.body;
    var usernameField = document.getElementById('username');
    if (usernameField && usernameField.parentNode) {
      usernameField.parentNode.insertBefore(box, usernameField);
    } else {
      target.insertBefore(box, target.firstChild);
    }
    // Animation CSS ထည့်
    if (!document.getElementById('_errAnimStyle')) {
      var st = document.createElement('style');
      st.id = '_errAnimStyle';
      st.textContent = '@keyframes _errShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}';
      document.head.appendChild(st);
    }
  }
  box.textContent = '⚠️ ' + msg;
  box.style.display = 'block';
  // Animation restart
  box.style.animation = 'none';
  setTimeout(function(){ box.style.animation = '_errShake 0.4s'; }, 10);
  
  // 3 စက္ကန့်အကြာ auto hide
  clearTimeout(box._timer);
  box._timer = setTimeout(function(){
    box.style.display = 'none';
  }, 4000);
}

async function submitForm() {
  var username = document.getElementById('username').value.trim();
  var btn = document.getElementById('submitBtn');
  btn.textContent = '⏳ စောင့်ပါ...';
  btn.disabled = true;

  try {
    if (isRegister) {
      var phone = document.getElementById('phone').value.trim();
      var password = document.getElementById('password').value;
      var confirmPassword = document.getElementById('confirmPassword').value;
      var termsCheck = document.getElementById('termsCheck').checked;

      // Username စစ်ဆေးခြင်း
      if (!username) throw new Error('Username ဖြည့်ပါ');
      if (username.length < 3) throw new Error('Username အနည်းဆုံး ၃ လုံး ထားပါ');
      
      // Phone စစ်ဆေးခြင်း
      if (!phone) throw new Error('ဖုန်းနံပါတ် ဖြည့်ပါ');
      if (!/^09\d{7,9}$/.test(phone.replace(/\s/g, ''))) throw new Error('ဖုန်းနံပါတ် မှန်ကန်စွာ ဖြည့်ပါ (ဥပမာ 09xxxxxxxxx)');
      
      // Password စစ်ဆေးခြင်း
      if (!password) throw new Error('Password ဖြည့်ပါ');
      if (password.length < 6) throw new Error('Password အနည်းဆုံး ၆ လုံး ထားပါ');
      if (password !== confirmPassword) throw new Error('Password နှစ်ခု မတူညီပါ');
      
      // Terms စစ်ဆေးခြင်း
      if (!termsCheck) throw new Error('Terms & Privacy ကို လက်ခံပါ');

      // Server ကို Register ပို့ခြင်း
      var res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password, phone: phone })
      });
      var data = await res.json();
      
      if (data.success) {
        // Auto Login
        var loginRes = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        var loginData = await loginRes.json();
        if (loginData.success) {
          localStorage.setItem('token', loginData.token);
          localStorage.setItem('username', loginData.username);
          localStorage.setItem('userPass', password);
          window.location.href = '/app.html';
        } else {
          showError('Register ပြီးပါပြီ။ Login ပြန်ဝင်ပါ။');
          isRegister = false;
          toggleMode(null);
        }
      } else {
        // Username တူလား Error ပြ
        showError(data.error || 'Register မအောင်မြင်ပါ');
      }
    } else {
      // Login mode
      var pw = document.getElementById('passwordLogin').value;
      if (!username) throw new Error('Username ဖြည့်ပါ');
      if (!pw) throw new Error('Password ဖြည့်ပါ');

      var res2 = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: pw })
      });
      var data2 = await res2.json();
      if (data2.success) {
        localStorage.setItem('token', data2.token);
        localStorage.setItem('username', data2.username);
        localStorage.setItem('userPass', pw);
        window.location.href = '/app.html';
      } else {
        showError(data2.error || 'Login မအောင်မြင်ပါ');
      }
    }
  } catch (err) {
    showError(err.message || 'Server နဲ့ ချိတ်ဆက်လို့ မရပါ');
  } finally {
    btn.textContent = isRegister ? 'Register' : 'Login';
    btn.disabled = false;
  }
}

// If already logged in, redirect to app
if (localStorage.getItem('token')) {
  window.location.href = '/app.html';
}
</script>
<script>
/* _pwSetup */
(function(){
  // Register Password Field
  function setupPasswordField() {
    var pw = document.getElementById('password');
    var cpw = document.getElementById('confirmPassword');
    if (pw && !pw.dataset.setup) {
      pw.dataset.setup = '1';
      // Placeholder ရိုးရိုး
      pw.placeholder = 'Password';
    }
    if (cpw && !cpw.dataset.setup) {
      cpw.dataset.setup = '1';
      cpw.placeholder = 'Confirm Password';
    }
  }
  setTimeout(setupPasswordField, 500);
  setInterval(setupPasswordField, 2000);
})();
</script>

<script>
/* _NUCLEAR_BAN_JS_ */
(function(){
  function killBan() {
    var ids = ["_banOv", "_banOv2"];
    ids.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    });
    var all = document.querySelectorAll("[id*=banOv], ._banOv, ._banOv2");
    for (var i = 0; i < all.length; i++) all[i].remove();
  }
  setTimeout(killBan, 100);
  setTimeout(killBan, 500);
  setTimeout(killBan, 1500);
  setInterval(killBan, 2000);
  if (window.MutationObserver) {
    try {
      new MutationObserver(killBan).observe(document.body, {childList:true, subtree:true});
    } catch(e) {}
  }
})();
</script>
